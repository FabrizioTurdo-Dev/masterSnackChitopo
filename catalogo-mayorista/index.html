  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#001bfa" />
    <title>Master Snacks — Catálogo mayorista</title>
    <meta
      name="description"
      content="Catálogo mayorista de Master Snacks: snacks hechos en La Pintana, como los suflés y el maní horneados de Chitopo. Arma tu pedido y lo cerramos por WhatsApp."
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Master Snacks" />
    <meta property="og:title" content="Master Snacks — Catálogo mayorista" />
    <meta
      property="og:description"
      content="Snacks hechos en La Pintana, al por mayor. Arma tu pedido y lo cerramos por WhatsApp."
    />
    <meta property="og:image" content="/catalogo/og-image.png" />
    <meta property="og:locale" content="es_CL" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      *,*::before,*::after{box-sizing:border-box}body{margin:0;background:#ffc20e;color:#0b0b1e}
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // El router funciona con hash (#/admin). Si alguien escribe /admin a mano,
      // lo mandamos al hash en vez de dejarlo en el catálogo sin explicación.
      (function () {
        var m = location.pathname.match(/\/(admin)\/?$/);
        if (m && !location.hash) {
          location.replace(
            location.pathname.slice(0, m.index + 1) + "#/" + m[1] + location.search
          );
        }
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
